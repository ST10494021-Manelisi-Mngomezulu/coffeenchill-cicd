name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  FUNCTIONS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CoffeeNchill.Functions

    steps:
      # 1. Checkout code and setup .NET SDK
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 2. Build and run unit tests
      - name: Build
        run: dotnet build CoffeeNchill.Functions/CoffeeNchill.Functions.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test CoffeeNchill.Tests/CoffeeNchill.Tests.csproj --configuration Release

      # 3. Package Docker container images
      - name: Build Docker images
        run: |
          docker build -t $FUNCTIONS_IMAGE:v${{ github.run_number }} -t $FUNCTIONS_IMAGE:latest -f CoffeeNchill.Functions/Dockerfile CoffeeNchill.Functions

      # 4. Authenticate and push version-tagged images to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        run: |
          docker push $FUNCTIONS_IMAGE:v${{ github.run_number }}
          docker push $FUNCTIONS_IMAGE:latest

      # 5. SSH into the VPS and run docker-compose pull && docker-compose up -d
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/coffeenchill
            docker-compose pull && docker-compose up -d